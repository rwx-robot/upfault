<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UpFault Counter Example</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
    .counter { text-align: center; }
    .counter p { font-size: 2rem; margin: 1rem 0; }
    button { 
      padding: 0.75rem 1.5rem; 
      margin: 0.5rem; 
      font-size: 1rem; 
      border: none; 
      border-radius: 4px; 
      cursor: pointer;
      transition: background 0.2s;
    }
    .increment-btn { background: #4CAF50; color: white; }
    .increment-btn:hover { background: #45a049; }
    .decrement-btn { background: #f44336; color: white; }
    .decrement-btn:hover { background: #da190b; }
    .reset-btn { background: #2196F3; color: white; }
    .reset-btn:hover { background: #1976D2; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
